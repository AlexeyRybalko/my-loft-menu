name: Deploy MY Loft menu to Cloud.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudru-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudru-production
      url: https://my-loft-menu.s3-website.cloud.ru
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build static site
        env:
          CLOUDRU_DEPLOY: "true"
        run: npx next build

      - name: Upload to Cloud.ru Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_TENANT_ID }}:${{ secrets.CLOUDRU_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_KEY_SECRET }}
          AWS_DEFAULT_REGION: ru-central-1
        run: >-
          aws s3 sync out s3://my-loft-menu
          --delete
          --endpoint-url https://s3.cloud.ru
          --no-progress

      - name: Verify deployment
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 3 --retry-all-errors
          https://my-loft-menu.s3-website.cloud.ru/
          --output /dev/null
